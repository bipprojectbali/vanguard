# Casbin model SUMBU BISNIS (CRM) — TERPISAH dari model tenant/platform.
#
# Kenapa enforcer kedua, bukan menumpang model.conf: sumbu tenant punya
# `g, super_admin, root` (god-mode) dan `g, staff, owner` (warisan). Kalau izin
# bisnis ikut model itu, owner/super_admin OTOMATIS mewarisi seluruh izin CRM —
# jadi "pemilik bayangan seluruh desa" dan Field-Level Security tak berarti
# baginya (docs/crm/sistem-dan-role.md §3). Sumbu bisnis wajib berdiri sendiri:
# wewenang platform ≠ wewenang bisnis.
#
# sub = business_role (admin|manager|sales|csm|support) dari memberships.business_role.
# obj = "crm:<modul>" (accounts, tickets, deals, …) — namespace crm: memisahkan
#       dari objek tenant (admin:*/dev:*/platform:*).
# act = read | write | approve (write = create/edit/hapus; approve khusus
#       deals/quotes/renewal — pembeda Sales dari Manager).
#
# write MENCAKUP read (cabang `p.act=="write" && r.act=="read"` di matcher): yang
# boleh menyunting pasti boleh melihat — jadi modul ✓/◐ubah cukup satu baris
# `write`, tak perlu baris `read` kembar. approve BERDIRI SENDIRI (menyetujui ≠
# menyunting); role yang approve umumnya juga punya write terpisah.
#
# SENGAJA TANPA [role_definition]: tak ada warisan antar-role bisnis (Support
# BUKAN "di bawah" Sales), dan TANPA cabang root — nol permukaan kebocoran.
# Deny-default murni: subject/obj tanpa baris p = ditolak.

[request_definition]
r = sub, obj, act

[policy_definition]
p = sub, obj, act

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = r.sub == p.sub && keyMatch(r.obj, p.obj) && (r.act == p.act || p.act == "*" || (p.act == "write" && r.act == "read"))
